<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeTrace Dashboard</title>
  </head>
  <body class="bg-zinc-950 text-zinc-100">
    <script>
      (function() {
        var c = document.body.classList;
        var has = c.contains('vscode-light') || c.contains('vscode-high-contrast-light');
        document.documentElement.className = has ? 'vt-light' : 'vt-dark';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
